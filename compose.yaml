services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./logs:/app/logs
      - ./data:/app/data
    init: true
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # E-mail: se o .env tiver SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD/SMTP_FROM, os e-mails vão de
      # verdade por esse provedor; senão vão para o Mailpit (coletor local, nada sai da máquina).
      # MAIL_SINK_*: endereços de mentira (exemplo.com etc., usados pelos testes) vão SEMPRE para o Mailpit,
      # mesmo com o provedor real configurado. Ver src/core/mailer.py.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-datavision@localhost}
      MAIL_SINK_HOST: mailpit
      MAIL_SINK_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: >
      python -m uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  db:
    image: postgres:18
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Django em construção (migração do FastAPI). Convive com o `app` atual: porta 8001, banco próprio
  # (datavision_dj). Quando a migração terminar, ele assume a porta 8000 e o `app` sai.
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    init: true
    volumes:
      - ./backend:/app
      - ./src/static/app:/app/static_src/app:ro  # interface React gerada (serviço frontend)
      - ./docs:/docs:ro  # contrato congelado do FastAPI (backend/scripts/contract_diff.py)
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${DJANGO_DB_NAME:-datavision_dj}
      LOG_DIR: /app/logs
      # E-mail: mesma regra do serviço app (provedor real se SMTP_* estiver no .env; senão Mailpit; e
      # endereços de mentira sempre ao Mailpit). Ver core/mailer.py.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-datavision@localhost}
      MAIL_SINK_HOST: mailpit
      MAIL_SINK_PORT: "1025"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Ao subir: aplica as migrações pendentes, garante o administrador inicial e o bucket do MinIO, e inicia o servidor de desenvolvimento.
    command: sh -c "python manage.py migrate --noinput && python manage.py ensure_admin && python manage.py ensure_bucket && python manage.py runserver 0.0.0.0:8000"

  # Coletor de e-mail para desenvolvimento e testes: recebe tudo e mostra numa tela. Nada é entregue de verdade.
  # SMTP na porta 1025 (só na rede interna do Compose); tela em http://localhost:8025 (só nesta máquina).
  mailpit:
    image: axllent/mailpit@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    profiles: ["test"]
    environment:
      BASE_URL: http://app:8000
      MAILPIT_URL: http://mailpit:8025
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./tests_e2e:/app/tests_e2e
    depends_on:
      - app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    profiles: ["frontend"]
    environment:
      OUT_DIR: /out
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
      - ./src/static/app:/out

volumes:
  frontend_node_modules:
  db_data:
  minio_data:
