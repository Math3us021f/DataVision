{# Ícones SVG embutidos (estilo traço, 24x24). Sem dependência externa: o MVP roda na rede local. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "home" -%}
<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>
{%- elif name == "users" -%}
<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6 6 0 0 1 3.5 6"/>
{%- elif name == "chart" -%}
<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>
{%- elif name == "logs" -%}
<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>
{%- elif name == "folder" -%}
<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
{%- elif name == "file" -%}
<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>
{%- elif name == "logout" -%}
<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == "cpu" -%}
<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
{%- elif name == "memory" -%}
<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 7v10M11 7v10M15 7v10M3 20h18"/>
{%- elif name == "disk" -%}
<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
{%- elif name == "network" -%}
<path d="M7 17V7l-3 3M17 7v10l3-3"/>
{%- elif name == "refresh" -%}
<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
{%- elif name == "plus" -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == "info" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- elif name == "logo" -%}
<path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/>
{%- elif name == "eye" -%}
<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "key" -%}
<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/>
{%- elif name == "close" -%}
<path d="M18 6 6 18M6 6l12 12"/>
{%- endif -%}
</svg>
{%- endmacro %}
