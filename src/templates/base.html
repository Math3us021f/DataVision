<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DataVision{% endblock %}</title>
    <script>
        // Aplica o tema antes de desenhar a página, para não "piscar" o tema errado.
        // Sem escolha salva, segue o tema do sistema operacional.
        (function () {
            var theme = null;
            try { theme = localStorage.getItem("datavision-theme"); } catch (e) {}
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}
    <main class="page">
        {% block content %}{% endblock %}
    </main>
    {% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
